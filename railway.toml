# Railway — optional Nixpacks/Docker hint
# Deploy: New Project → Deploy from GitHub → select this repo
# Settings → set Start Command to: bash scripts/start_hosted.sh
# Or leave blank and set Dockerfile CMD (see Dockerfile HOSTED comment)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bash scripts/start_hosted.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
